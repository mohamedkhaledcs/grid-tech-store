<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Forgot Password | Tech Store</title>

        <link rel="stylesheet" href="../css/forget-pass.css">
    </head>

    <body>
        <div class="forgotPage">
            <div class="forgotBox">
                <a href="./login.html" class="back">← Back to Login</a>

                <div class="forgotText">
                    <h1>Forgot Password?</h1>

                    <p>حد ينسى الباص يعم انت متقرفوناش بقاا بس هساعد اعمل اي بقى حسبي الله</p>
                    <p>😂😂❤️</p>

                    <p>
                        Don't worry. Enter your email address and
                        we'll help you reset your password.
                    </p>
                </div>

                <form class="forgotForm">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <button type="submit">Reset Password</button>
                </form>

                <p class="signupText">
                    Don't have an account?

                    <a href="./sign-up.html">Sign Up</a>
                </p>
            </div>
        </div>
    </body>
</html>
