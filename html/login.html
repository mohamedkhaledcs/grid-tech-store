<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Login | Tech Store</title>

        <link rel="stylesheet" href="../css/login.css">
    </head>

    <body>
        <div class="loginPage">
            <div class="loginBox">
                <a href="../index.html" class="back">← Back to Tech Store</a>

                <div class="loginText">
                    <h1>Welcome Back</h1>

                    <p>
                        Login to continue exploring the latest
                        technology products.
                    </p>
                </div>

                <form class="loginForm">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <div class="remember">
                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="./forget-pass.html">Forgot Password?</a>
                    </div>

                    <button type="submit">Login</button>
                </form>

                <p class="signupText">
                    Don't have an account?

                    <a href="./sign-up.html">Sign Up</a>
                </p>
            </div>
        </div>
    </body>
</html>
